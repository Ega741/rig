[package]
name = "hashmine_keccak"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# 0.1 exposes keccak::f1600; 0.2 changed the API. Measured 5.3 MH/s per thread vs 1.5 for a hand-written loop.
keccak = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
